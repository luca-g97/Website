<!DOCTYPE html>
<html lang="en" class="scroll-smooth bg-base">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luca G. | Personal Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-mono bg-base text-white antialiased selection:bg-white selection:text-black lg:h-screen lg:overflow-hidden flex flex-col">

<div class="max-w-[1800px] mx-auto w-full flex flex-col p-4 md:p-6 lg:p-10 relative lg:h-full min-h-screen lg:min-h-0">
    <!-- Procedural Header -->
    <header id="site-header"></header>

    <!-- Main Layout -->
    <main class="flex flex-col lg:flex-row gap-6 lg:gap-10 flex-1 lg:overflow-hidden relative z-10 h-full">
        <!-- Procedural Left Sidebar -->
        <aside id="site-sidebar"></aside>

        <!-- Right Bento Grid Container -->
        <div class="flex-1 w-full lg:h-full lg:overflow-y-auto no-scrollbar pb-6 lg:pb-0">
            <div class="grid grid-cols-1 md:grid-cols-6 lg:grid-cols-12 gap-3 md:gap-4 lg:gap-5 auto-rows-[250px] md:auto-rows-[280px] lg:grid-rows-desktop md:grid-rows-tablet lg:h-full">
                <!-- 1. Interactive Media -->
                <div class="bento-card col-span-1 md:col-span-3 lg:col-span-6 lg:h-full flex items-center justify-center group relative fade-in-up" style="animation-delay: 150ms;">
                    <div class="absolute inset-0 marquee-mask-y opacity-50 group-hover:opacity-100 transition-opacity duration-700 pointer-events-none">
                        <div id="interactive-marquee" class="w-full animate-scroll-y flex flex-col"></div>
                    </div>
                    <h2 class="relative z-10 text-[24px] md:text-[26px] xl:text-[32px] font-bold text-white drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] text-center tracking-tight pointer-events-none">Interactive<br>Media</h2>
                    <a href="pages/projects.html" data-open="projects" class="card-link-btn absolute bottom-4 right-4 md:bottom-5 md:right-5 w-9 h-9 md:w-10 md:h-10 bg-white border-4 border-card rounded-full flex items-center justify-center z-20 shadow-lg group-hover:border-[#2a2a2a] interactive">
                        <i class="ph ph-arrow-up-right text-black font-bold text-base md:text-lg"></i>
                    </a>
                </div>

                <!-- 2. Academic Research -->
                <div class="bento-card col-span-1 md:col-span-3 lg:col-span-6 lg:h-full flex items-center justify-center group relative fade-in-up" style="animation-delay: 250ms;">
                    <div class="absolute inset-0 marquee-mask-y opacity-50 group-hover:opacity-100 transition-opacity duration-700 pointer-events-none">
                        <div id="academic-marquee" class="w-full animate-scroll-y-reverse flex flex-col"></div>
                    </div>
                    <h2 class="relative z-10 text-[24px] md:text-[26px] xl:text-[32px] font-bold text-white drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] text-center tracking-tight pointer-events-none">Academic<br>Research</h2>
                    <a href="pages/about.html" data-open="publications" class="card-link-btn absolute bottom-4 right-4 md:bottom-5 md:right-5 w-9 h-9 md:w-10 md:h-10 bg-white border-4 border-card rounded-full flex items-center justify-center z-20 shadow-lg group-hover:border-[#2a2a2a] interactive">
                        <i class="ph ph-arrow-up-right text-black font-bold text-base md:text-lg"></i>
                    </a>
                </div>

                <!-- 3. Contact WebGL Globe -->
                <a href="pages/contact.html" data-action="open-route" data-route="contact" class="bento-card col-span-1 md:col-span-2 lg:col-span-3 lg:h-full p-5 md:p-6 group block interactive fade-in-up group-hover:opacity-100" style="animation-delay: 350ms;">
                    <h3 class="text-base font-bold absolute top-5 left-5 z-20 tracking-wide text-gray-300">Contact</h3>
                    <div class="absolute -bottom-[50%] -right-[20%] w-[130%] h-[150%] group-hover:scale-105 transition-transform duration-[1000ms] pointer-events-none">
                        <canvas id="cobe-globe" class="w-full h-full opacity-90"></canvas>
                    </div>
                    <div class="card-link-btn absolute bottom-4 right-4 md:bottom-5 md:right-5 w-9 h-9 md:w-10 md:h-10 bg-white border-4 border-card rounded-full flex items-center justify-center z-20 shadow-lg group-hover:border-[#2a2a2a]">
                        <i class="ph ph-arrow-up-right text-black font-bold text-base md:text-lg"></i>
                    </div>
                </a>

                <!-- 4. My Stack -->
                <a href="pages/stack.html" data-action="open-route" data-route="stack" class="bento-card col-span-1 md:col-span-2 lg:col-span-5 lg:h-full p-5 md:p-6 flex flex-col items-center justify-center interactive relative fade-in-up group-hover:opacity-100" style="animation-delay: 450ms;">
                    <h3 class="text-base font-bold absolute top-5 left-5 tracking-wide text-gray-300">My Stack</h3>
                    <div id="stack-container" class="flex flex-wrap items-center justify-center relative z-10 mt-6 w-full"></div>
                    <div class="card-link-btn absolute bottom-4 right-4 md:bottom-5 md:right-5 w-9 h-9 md:w-10 md:h-10 bg-white border-4 border-card rounded-full flex items-center justify-center z-20 shadow-lg group-hover:border-[#2a2a2a]">
                        <i class="ph ph-arrow-up-right text-black font-bold text-base md:text-lg"></i>
                    </div>
                </a>

                <!-- 5. Featured Project -->
                <a id="featured-link" href="pages/projects.html" data-open="projects" class="bento-card col-span-1 md:col-span-2 lg:col-span-4 lg:h-full group block interactive overflow-hidden fade-in-up group-hover:opacity-100" style="animation-delay: 550ms;">
                    <div class="absolute inset-0">
                        <img id="featured-img" src="" alt="" class="w-full h-full object-cover opacity-80 group-hover:scale-110 transition-transform duration-1000">
                        <div class="absolute inset-0 bg-gradient-to-b from-black/80 via-transparent to-transparent"></div>
                    </div>
                    <h3 id="featured-title" class="text-base font-bold absolute top-5 left-5 z-10 drop-shadow-lg tracking-wide text-gray-300"></h3>
                    <div class="card-link-btn absolute bottom-4 right-4 md:bottom-5 md:right-5 w-9 h-9 md:w-10 md:h-10 bg-white border-4 border-card rounded-full flex items-center justify-center z-20 shadow-lg group-hover:border-[#2a2a2a]">
                        <i class="ph ph-arrow-up-right text-black font-bold text-base md:text-lg"></i>
                    </div>
                </a>
            </div>

            <!-- Procedural Mobile Footer -->
            <div id="site-mobile-footer"></div>
        </div>
    </main>
</div>

<script type="module" src="assets/js/globe.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
