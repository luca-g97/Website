<!DOCTYPE html>
<html lang="en" class="scroll-smooth bg-base">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Lecture | Luca G.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="../assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="font-mono bg-base text-white antialiased selection:bg-white selection:text-black lg:h-screen lg:overflow-hidden flex flex-col">

<div class="max-w-[1800px] mx-auto w-full flex flex-col p-4 md:p-6 lg:p-10 relative lg:h-full min-h-screen lg:min-h-0">
    <!-- Procedural Header -->
    <header id="site-header"></header>

    <!-- Main Layout -->
    <main class="flex flex-col lg:flex-row gap-6 lg:gap-10 flex-1 lg:overflow-hidden relative z-10 h-full">
        <!-- Procedural Left Sidebar -->
        <aside id="site-sidebar"></aside>

        <!-- Right Lecture Detail Area -->
        <div class="flex-1 w-full lg:h-full lg:overflow-y-auto no-scrollbar pb-10">
            <div class="mb-6 md:mb-8 fade-in-up" style="animation-delay: 150ms;">
                <h1 id="detail-title" class="text-2xl md:text-[32px] lg:text-[38px] font-bold text-white tracking-wide leading-[1.25] max-w-3xl">
                    Loading...
                </h1>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                <!-- Left 8 Columns: Video, Meta & Content -->
                <div class="lg:col-span-8 flex flex-col gap-5 fade-in-up" style="animation-delay: 250ms;">
                    <div id="detail-video-container" class="bento-card w-full aspect-video relative group interactive overflow-hidden bg-black"></div>

                    <div class="bento-card p-5 md:p-6 flex flex-col gap-2 text-xs md:text-sm text-gray-300">
                        <p>Date Added: <span id="detail-date" class="text-white">--</span></p>
                        <p>Video Duration: <span id="detail-duration" class="text-white">--</span></p>
                    </div>

                    <div id="detail-content" class="bento-card p-6 md:p-8 flex flex-col gap-6 text-sm leading-relaxed text-textMuted"></div>
                </div>

                <!-- Right 4 Columns: Other Tutorials Sidebar -->
                <div class="lg:col-span-4 flex flex-col gap-4 fade-in-up sticky top-0" style="animation-delay: 350ms;">
                    <h2 class="text-base md:text-lg font-bold text-white tracking-wide px-1">Other Tutorials</h2>
                    <div id="other-tutorials-feed" class="flex flex-col gap-5"></div>
                </div>
            </div>

            <!-- Procedural Mobile Footer -->
            <div id="site-mobile-footer"></div>
        </div>
    </main>
</div>

<script src="../assets/js/app.js"></script>
</body>
</html>
